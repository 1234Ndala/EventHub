name: 🚀 EventHub CI/CD

on:
  push:
    branches: [main, develop, GITHUB]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ==================== TESTS ====================
  test:
    name: 🧪 Tests Unitaires
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [events-service, participants-service, registrations-service]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eventsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: eventsdb
      DB_USER: postgres
      DB_PASSWORD: password
      DB_PORT: 5432
      EVENTS_SERVICE_URL: http://localhost:8001
      PARTICIPANTS_SERVICE_URL: http://localhost:8002

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        working-directory: ./${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install pytest httpx python-dotenv

      - name: 🗄️ Create registrationsdb
        if: matrix.service == 'registrations-service'
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE registrationsdb;"

      - name: 🧪 Tests
        working-directory: ./${{ matrix.service }}
        run: pytest test_main.py -v

  # ==================== BUILD ====================
  build:
    name: 🐳 Build Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🔨 Build images
        run: |
          docker build -t eventhub-events ./events-service
          docker build -t eventhub-participants ./participants-service
          docker build -t eventhub-registrations ./registrations-service

  # ==================== PUSH ====================
  push:
    name: 📤 Push Docker Hub
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.shakrem }}
          password: ${{ secrets.dckr_pat_E8srVjl8BiJgR4PMyh9zWM9G6aQ}}

      - name: 📤 Build & Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eventhub-events:latest ./events-service
          docker push ${{ secrets.DOCKER_USERNAME }}/eventhub-events:latest
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eventhub-participants:latest ./participants-service
          docker push ${{ secrets.DOCKER_USERNAME }}/eventhub-participants:latest
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eventhub-registrations:latest ./registrations-service
          docker push ${{ secrets.DOCKER_USERNAME }}/eventhub-registrations:latest

  # ==================== DEPLOY ====================
  deploy:
    name: 🚀 Deploy
    needs: push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/eventhub
            docker compose pull
            docker compose up -d
            docker image prune -f
