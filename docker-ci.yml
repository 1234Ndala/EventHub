name: EventHub Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et démarrer les services
        run: docker compose up -d --build

      - name: Attendre le démarrage des services
        run: |
          sleep 20
          docker compose ps

      - name: Vérifier la disponibilité des services HTTP
        shell: bash
        run: |
          set -uo pipefail

          check_service() {
            local name="$1"
            local url="$2"
            local error_file
            local http_code
            local curl_status

            error_file="$(mktemp)"
            set +e
            http_code="$(curl -f --silent --show-error \
              --retry 5 --retry-delay 3 --connect-timeout 5 --max-time 30 \
              -o /dev/null -w '%{http_code}' "$url" 2>"$error_file")"
            curl_status=$?
            set -e

            # Une réponse HTTP 200–499 prouve que le service est joignable.
            # Cela autorise notamment une route racine qui répond 404.
            if [[ "$http_code" =~ ^[2-4][0-9][0-9]$ ]]; then
              echo "OK: $name répond sur $url (HTTP $http_code)"
            else
              echo "ÉCHEC: $name ne répond pas correctement sur $url"
              echo "Code curl: $curl_status"
              cat "$error_file"
              rm -f "$error_file"
              return 1
            fi

            rm -f "$error_file"
          }

          check_service "events-service" "http://localhost:8001/"
          check_service "participants-service" "http://localhost:8002/"
          check_service "registrations-service" "http://localhost:8003/"
          check_service "frontend" "http://localhost:3000/"

      - name: Afficher les logs en cas d'échec
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Arrêter et nettoyer les conteneurs
        if: ${{ always() }}
        run: docker compose down -v
